// Ordinary version ownership for dependencies outside Boot's managed platform.
versions += [
        baseScala: '2.13',
        scala: '2.13.18',
        spark: '4.2.1',
        scalaCollectionCompat: '2.14.0',
        scalaJava8Compat: '1.0.2',
        scalaLogging: '3.9.6',
        guava: '33.7.2-jre',
        redisson: '4.8.0',
        autoValue: '1.11.1',
        rocksdb: '11.8.1',
        kotlinLogging: '8.0.4',
        logstashEncoder: '9.0',
        springdoc: '3.2.0',
        mockwebserver: '5.5.1',
]

libs += [
        scalaCollectionCompat: "org.scala-lang.modules:scala-collection-compat_$versions.baseScala:$versions.scalaCollectionCompat",
        scalaJava8Compat: "org.scala-lang.modules:scala-java8-compat_$versions.baseScala:$versions.scalaJava8Compat",
        scalaLibrary: "org.scala-lang:scala-library:$versions.scala",
        scalaReflect: "org.scala-lang:scala-reflect:$versions.scala",
        scalaLogging: "com.typesafe.scala-logging:scala-logging_$versions.baseScala:$versions.scalaLogging",
        mongoSet: ['org.springframework.boot:spring-boot-starter-data-mongodb-reactive', 'org.mongodb:mongodb-driver-sync'],
        sqlSet: ['io.asyncer:r2dbc-mysql',
                 'org.springframework.boot:spring-boot-starter-data-r2dbc'],
        protobufSet: ['io.grpc:grpc-netty-shaded', 'io.grpc:grpc-protobuf', 'io.grpc:grpc-stub',
                      'com.google.protobuf:protobuf-java-util', 'io.grpc:grpc-kotlin-stub', 'io.grpc:grpc-services'],
        // Upstream Spark APIs remain compile-only; worker runtime/bootstrap has separate acceptance.
        sparkSet: [
                "org.apache.spark:spark-sql_$versions.baseScala:$versions.spark",
                "org.apache.spark:spark-core_$versions.baseScala:$versions.spark",
                "org.apache.spark:spark-kubernetes_$versions.baseScala:$versions.spark"
        ],
        // Reactor Kafka is discontinued. KafkaService's supported Spring Kafka migration belongs to 3.2.
        kafkaSet: ['org.apache.kafka:kafka-clients', 'org.springframework.boot:spring-boot-starter-kafka'],
]

dependencies {
    implementation 'io.projectreactor:reactor-core'
    implementation 'io.projectreactor.addons:reactor-extra'
    implementation 'org.springframework.boot:spring-boot'
    // Boot 4 moved the former spring-boot-autoconfigure cache capability into this module.
    implementation 'org.springframework.boot:spring-boot-cache'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'
    implementation 'org.springframework:spring-aspects'
    implementation 'com.github.ben-manes.caffeine:caffeine'
    implementation 'com.google.code.gson:gson'
    implementation "com.google.guava:guava:$versions.guava"
    implementation 'io.lettuce:lettuce-core'
    implementation 'io.netty:netty-all'
    implementation 'org.quartz-scheduler:quartz'
    implementation 'org.quartz-scheduler:quartz-jobs'
    implementation 'org.yaml:snakeyaml'
    implementation "org.redisson:redisson:$versions.redisson"
    implementation 'org.slf4j:slf4j-api'
    implementation 'commons-codec:commons-codec'
    implementation 'io.micrometer:micrometer-registry-prometheus'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.testcontainers:testcontainers'
    testImplementation 'org.testcontainers:testcontainers-kafka'

    compileOnly 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    compileOnly "com.google.auto.value:auto-value-annotations:$versions.autoValue"
    annotationProcessor "com.google.auto.value:auto-value:$versions.autoValue"

    implementation "org.rocksdb:rocksdbjni:$versions.rocksdb"
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8'
    implementation 'org.jetbrains.kotlin:kotlin-reflect'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-reactor'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-jdk8'
    // GeneralDataProvider retains its Jackson 2 Kotlin parser; shared policy aligns both BOMs.
    implementation 'com.fasterxml.jackson.module:jackson-module-kotlin'
    implementation 'tools.jackson.module:jackson-module-kotlin'
    implementation "tools.jackson.module:jackson-module-scala_$versions.baseScala"
    implementation "io.github.oshai:kotlin-logging-jvm:$versions.kotlinLogging"
    implementation "net.logstash.logback:logstash-logback-encoder:$versions.logstashEncoder"

    implementation libs.scalaCollectionCompat
    implementation libs.scalaJava8Compat
    implementation libs.scalaLibrary
    implementation libs.scalaReflect
    implementation libs.scalaLogging
    project.xlnImplement(libs.mongoSet)
    project.xlnImplement(libs.sqlSet)
    project.xlnImplement(libs.protobufSet)
    project.xlnImplement(libs.kafkaSet)
}
