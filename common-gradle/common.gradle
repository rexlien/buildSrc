apply plugin:'java'
apply plugin:'war'
apply plugin:'scala'
apply plugin: 'io.spring.dependency-management'
apply plugin: 'project-report'

// Configure before protobuf finalizes its locators. Either convention order may install
// management first; both imports and common's repositories must exist before this lookup.
ext.xlnConfigureManagedGenerators = {
    if (project.ext.has('xlnManagedGeneratorsConfigured') && project.ext.xlnManagedGeneratorsConfigured) {
        return
    }
    protobuf {
        def managedVersions = project.dependencyManagement.managedVersions
        protoc {
            artifact = "com.google.protobuf:protoc:${managedVersions['com.google.protobuf:protobuf-java']}"
        }
        plugins {
            grpc {
                artifact = "io.grpc:protoc-gen-grpc-java:${managedVersions['io.grpc:grpc-core']}"
            }
            grpckt {
                artifact = "io.grpc:protoc-gen-grpc-kotlin:${managedVersions['io.grpc:grpc-kotlin-stub']}:jdk8@jar"
            }
        }
    }
    project.ext.xlnManagedGeneratorsConfigured = true
}
if (project.ext.has('xlnDependencyManagementConfigured')) {
    project.ext.xlnConfigureManagedGenerators.call()
}

protobuf {
    generateProtoTasks {
        all().configureEach { task ->
            task.plugins { options ->
                // Boot 4 registers grpc itself, including its @generated=omit option.
                // Decide at task realization so common.gradle may precede boot.gradle.
                if (!project.plugins.hasPlugin('org.springframework.boot')) {
                    options.maybeCreate('grpc')
                }
                options.maybeCreate('grpckt')
            }
        }
    }
    //generatedFilesBaseDir = "$projectDir/src"

}

