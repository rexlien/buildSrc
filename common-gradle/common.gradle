def toolchainVersions = new Properties()
rootProject.file('buildSrc/common-gradle/toolchain.properties').withInputStream { toolchainVersions.load(it) }
def targetJavaVersion = toolchainVersions.getProperty('javaVersion').toInteger()

allprojects {

    repositories {

        maven {
            url "https://maven.pkg.github.com/rexlien/maven"
            credentials {
                username=project.findProperty("gpr.name") ?: System.getenv("GPR_NAME")
                password=project.findProperty("gpr.key") ?: System.getenv("GPR_KEY")
            }
            content {
                includeGroup "com.github.rexlien"
            }
        }
        //
        //jcenter()
        mavenCentral()
        //maven {url "https://dl.bintray.com/rlien-2/java"}

        //maven {url "https://repo.spring.io/milestone/"}
        //maven {url "https://repo.spring.io/plugins-release/"}
        //maven {url "http://oss.jfrog.org/artifactory/oss-snapshot-local"}

    }

    plugins.withId('java') {
        java {
            toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
            sourceCompatibility = JavaVersion.toVersion(targetJavaVersion)
            targetCompatibility = JavaVersion.toVersion(targetJavaVersion)
        }
        tasks.withType(JavaCompile).configureEach {
            options.release = targetJavaVersion
        }
    }

    plugins.withId('checkstyle') {
        checkstyle.toolVersion = toolchainVersions.getProperty('checkstyleVersion')
    }

    tasks.withType(ScalaCompile).configureEach {
        sourceCompatibility = targetJavaVersion.toString()
        targetCompatibility = targetJavaVersion.toString()
    }

    plugins.withId('org.jetbrains.kotlin.jvm') { kotlinPlugin ->
        def kotlinCompileClass = kotlinPlugin.class.classLoader.loadClass('org.jetbrains.kotlin.gradle.tasks.KotlinCompile')
        def jvmTargetClass = kotlinPlugin.class.classLoader.loadClass('org.jetbrains.kotlin.gradle.dsl.JvmTarget')
        kotlin.jvmToolchain(targetJavaVersion)
        tasks.withType(kotlinCompileClass).configureEach {
            compilerOptions.jvmTarget = jvmTargetClass.fromTarget(targetJavaVersion.toString())
        }
    }
}

tasks.named('wrapper') {
    gradleVersion = toolchainVersions.getProperty('gradleVersion')
    distributionSha256Sum = toolchainVersions.getProperty('gradleDistributionSha256Sum')
    distributionType = Wrapper.DistributionType.BIN
}



