// Apply to each root ScriptHandler before the plugins DSL resolves its classpath.
// Application dependency management runs later and cannot secure this graph.
repositories {
    mavenCentral()
}
dependencies {
    classpath platform('tools.jackson:jackson-bom:3.1.8')
    constraints {
        classpath('org.apache.commons:commons-lang3:3.20.0') {
            because 'Boot buildpack/loader tooling inherits vulnerable Commons Compress transitives'
        }
    }
}
